# L'appli tourne dans le navigateur : c'est lui qui appelle ces services cartographiques.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://photon.komoot.io https://routing.openstreetmap.de https://router.project-osrm.org https://api.transitous.org https://overpass-api.de https://overpass.private.coffee https://maps.mail.ru; frame-ancestors 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
